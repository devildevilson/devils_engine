name: build

on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # scripts/ is not committed yet; these three tests run Python scripts from it.
  UNTRACKED_SCRIPT_TESTS: "^(module_profile_migration|test_build_dependencies_contract|project_task_ids_contract)$"
  # Seconds per test without its own TIMEOUT property. Without it ctest waits forever, and one hung
  # test silently ate the whole Windows job limit (iteration 10).
  TEST_TIMEOUT: "300"

# Every step tees its output into ci-logs/; on failure report_errors.py turns the error lines into
# annotations, which (unlike job logs) can be read without signing in.

jobs:
  linux:
    # Ubuntu 26.04 LTS in a container: GCC 15, GLFW 3.4 and Lua 5.4 from the distribution.
    # (24.04 ships GLFW 3.3, and its GCC 14.2 has an internal compiler error on qlibs/reflect.)
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git g++ cmake ninja-build pkg-config ccache python3 \
            liblua5.4-dev libzstd-dev libssl-dev libglfw3-dev \
            libvulkan-dev libshaderc-dev glslang-dev glslang-tools spirv-tools \
            mesa-vulkan-drivers xvfb xauth

      - uses: actions/checkout@v7

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          mkdir -p ci-logs
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            2>&1 | tee ci-logs/configure.log

      - name: Build
        id: build
        # nproc is the runner's CPU count (4 on a standard public-repo runner).
        run: |
          ccache --max-size=3G
          cmake --build build --parallel "$(nproc)" -- -k 0 2>&1 | tee ci-logs/build.log
          ccache --show-stats

      # Saved right after the build, whatever the result: the combined cache action saves only when
      # the whole job succeeds, so every run after a failed one started from an empty cache.
      - name: Save ccache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}

      - name: Test
        # lavapipe (mesa-vulkan-drivers) is the Vulkan device; xvfb is the display for GLFW.
        timeout-minutes: 90
        run: |
          xvfb-run -a ctest --test-dir build -L devils_engine -E "$UNTRACKED_SCRIPT_TESTS" \
            --timeout "$TEST_TIMEOUT" --output-on-failure --parallel 2 2>&1 | tee ci-logs/test.log

      - name: Slowest tests
        if: always()
        run: python3 .github/scripts/slow_tests.py ci-logs/test.log

      - name: Report errors
        if: failure() || cancelled()
        run: python3 .github/scripts/report_errors.py ci-logs/configure.log ci-logs/build.log ci-logs/test.log

  package-linux:
    # Packages for other machines are built against Debian 13 (glibc 2.41): a binary needs a glibc
    # no older than the one it was linked against, and the test job's Ubuntu 26.04 has 2.43.
    # Everything else the executables load travels inside the package (package_runtime.cmake).
    # Two instruction sets: the default AVX build died with SIGILL on a VPS whose CPU is QEMU's
    # baseline model (SSE2/SSE3 only), so `baseline` is built with DEVILS_ENGINE_ARCH=OFF for such
    # servers and `avx` stays for desktops. Same root either way: no FMA, no FP contraction.
    name: package-linux (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            arch: "OFF"
          - name: avx
            arch: AVX
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git g++ cmake ninja-build pkg-config ccache python3 binutils qemu-user \
            liblua5.4-dev libzstd-dev libssl-dev libglfw3-dev \
            libvulkan-dev libshaderc-dev glslang-dev glslang-tools spirv-tools

      - uses: actions/checkout@v7

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-debian13-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-debian13-${{ matrix.name }}-

      - name: Configure
        run: |
          mkdir -p ci-logs
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDEVILS_ENGINE_ARCH=${{ matrix.arch }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            2>&1 | tee ci-logs/configure.log

      - name: Build packages
        id: build
        run: |
          ccache --max-size=2G
          cmake --build build --target frontier_online_headless_package frontier_online_client_package \
            --parallel "$(nproc)" -- -k 0 2>&1 | tee ci-logs/build.log
          ccache --show-stats

      - name: Save ccache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-debian13-${{ matrix.name }}-${{ github.sha }}

      - name: Check packages
        # The headless contract check runs from the package itself, with only its own libraries.
        run: |
          exec > >(tee ci-logs/check.log) 2>&1
          cd build/subprojects/frontier_online
          for b in headless-package/bin/frontier_online_server client-package/bin/frontier_online; do
            echo "$b needs $(objdump -T "$b" "$(dirname "$b")"/*.so* | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          done
          cd headless-package
          ./bin/frontier_online_server --ticks=120 --verify --resources=resources/modules 2>&1 | tail -n 3
          if [ "${{ matrix.name }}" = baseline ]; then
            # The VPS's CPU, emulated: qemu64 is "QEMU Virtual CPU version 2.5+" (SSE2/SSE3, no
            # SSSE3/SSE4/POPCNT/AVX). Any instruction above it is SIGILL here, as it was there.
            # Debian's own libraries are baseline, so this covers everything the package loads.
            # Same binary, two CPUs: runtime-dispatched code (FastNoise2 picks SSE2 under qemu64,
            # AVX2/AVX-512 on the runner) must give the same terrain and state. FASTNOISE2_STRICT_FP
            # promises that; this is where a broken promise would show. Log lines start with '['.
            for args in "--terrain=8 --world-seed=20260911" "--ticks=120 --verify"; do
              ./bin/frontier_online_server $args --resources=resources/modules | grep -v '^\[' > native.txt
              qemu-x86_64 -cpu qemu64 ./bin/frontier_online_server $args --resources=resources/modules \
                | grep -v '^\[' > qemu64.txt
              diff native.txt qemu64.txt || { echo "::error::$args differs between the runner CPU and qemu64"; exit 1; }
              grep 'root' native.txt
            done
            rm native.txt qemu64.txt
            # ld.so refuses a binary whose ELF note demands a higher ISA level, whatever its code.
            if readelf -n bin/frontier_online_server | grep 'x86 ISA needed'; then
              echo "::error::frontier_online_server carries an x86 ISA-level requirement"; exit 1
            fi
          fi
          # A zip artifact drops the executable bit; a tarball inside it keeps it.
          cd .. && tar -czf frontier_online-linux-${{ matrix.name }}.tar.gz headless-package client-package

      - uses: actions/upload-artifact@v7
        with:
          name: frontier_online-linux-${{ matrix.name }}
          path: build/subprojects/frontier_online/frontier_online-linux-${{ matrix.name }}.tar.gz
          retention-days: 30

      - name: Reference trace
        # The windows job compares its own trace against this one (cross-platform determinism).
        if: matrix.name == 'avx'
        run: |
          cd build/subprojects/frontier_online/headless-package
          ./bin/frontier_online_server --trace --ticks=2000 --workers=2 --resources=resources/modules \
            | grep '^trace ' > ../trace-linux.txt
          tail -n 1 ../trace-linux.txt

      - uses: actions/upload-artifact@v7
        if: matrix.name == 'avx'
        with:
          name: frontier-trace-linux
          path: build/subprojects/frontier_online/trace-linux.txt
          retention-days: 7

      - name: Report errors
        if: failure() || cancelled()
        run: python3 .github/scripts/report_errors.py ci-logs/configure.log ci-logs/build.log ci-logs/check.log

  windows:
    runs-on: windows-2025
    outputs:
      diverged: ${{ steps.xtrace.outputs.diverged }}
      tick: ${{ steps.xtrace.outputs.tick }}
    # Configure ~25 min + build + tests (own step limit below); hosted runners stop at 6 h.
    timeout-minutes: 340
    env:
      VCPKG_COMMIT: 4702e381dbbd9b54d3f7e1eb565cd8981c1814cd
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_CACHE: ${{ github.workspace }}\..\vcpkg-cache
      CCACHE_DIR: ${{ github.workspace }}\..\ccache
      CCACHE_VERSION: "4.14.2"
      CCACHE_SHA256: 6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: MSVC environment
        # Ninja runs cl.exe directly, so the Visual Studio developer environment (compiler, SDK,
        # INCLUDE/LIB) must be in every later step: take what vcvars64 changes and export it.
        # Except VCPKG_*: vcvars points VCPKG_ROOT at the copy bundled with Visual Studio, and that
        # override made the clone of our pinned vcpkg fail on an existing directory.
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Output "Visual Studio: $vs"
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $Matches[1] -notlike 'VCPKG_*' -and
                [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Install ccache
        run: |
          $zip = "$env:RUNNER_TEMP\ccache.zip"
          Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/ccache-$env:CCACHE_VERSION-windows-x86_64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:CCACHE_SHA256) { throw "ccache archive hash mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\ccache-$env:CCACHE_VERSION-windows-x86_64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_CACHE }}
          key: vcpkg-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_CACHE" | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_CACHE,readwrite" >> $env:GITHUB_ENV

      - name: Configure
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          # Ninja schedules single files of all targets across the cores; the Visual Studio generator
          # ran whole projects in parallel and compiled each project's files one by one (no /MP).
          # cl is named explicitly: the image also has MinGW gcc on PATH.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows 2>&1 | Tee-Object -FilePath ci-logs\configure.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # vcpkg builds its ports during configure. Save them even when a later step fails, so the
      # next run does not rebuild OpenSSL and shaderc from scratch.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_CACHE }}
          key: vcpkg-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        id: build
        # NUMBER_OF_PROCESSORS is the runner's CPU count (4 on a standard public-repo runner).
        run: |
          ccache --max-size=3G
          ccache --zero-stats
          cmake --build build --parallel $env:NUMBER_OF_PROCESSORS -- -k 0 2>&1 | Tee-Object -FilePath ci-logs\build.log
          $code = $LASTEXITCODE
          ccache --show-stats
          if ($code) { exit $code }

      - name: Save ccache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.sha }}

      - name: Disable crash dialogs
        # Runs (with the tests) even when packaging failed: a broken package must not hide test results.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # A crashing process otherwise waits on a Windows Error Reporting dialog nobody closes, and
        # the test reads as a timeout instead of a crash with its exit code.
        run: |
          $wer = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting"
          New-Item -Path $wer -Force | Out-Null
          Set-ItemProperty -Path $wer -Name DontShowUI -Value 1 -Type DWord
          Set-ItemProperty -Path $wer -Name Disabled -Value 1 -Type DWord
          # A missing DLL is a different dialog (a system hard error, not WER): without ErrorMode=2
          # the loader waits on "code execution cannot proceed" and the test times out after 300 s.
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Windows" -Name ErrorMode -Value 2 -Type DWord

      - name: Package
        id: package
        # Before the tests: they take hours and fail for reasons unrelated to these two programs.
        # The run's status still says whether the tests passed.
        if: steps.build.outcome == 'success'
        run: |
          cmake --build build --target frontier_online_headless_package frontier_online_client_package 2>&1 | Tee-Object -FilePath ci-logs\package.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        if: steps.package.outcome == 'success'
        with:
          name: frontier_online-windows
          path: |
            build/subprojects/frontier_online/headless-package
            build/subprojects/frontier_online/client-package
          retention-days: 30

      # Cross-platform determinism: the same world on Linux and Windows, tick by tick. The Linux
      # trace comes from package-linux (avx), which finishes long before this build does.
      - uses: actions/download-artifact@v8
        if: steps.package.outcome == 'success'
        with:
          name: frontier-trace-linux
          path: ci-xtrace

      - name: Cross-platform trace
        id: xtrace
        if: steps.package.outcome == 'success'
        run: |
          Push-Location build\subprojects\frontier_online\headless-package
          cmd /c "bin\frontier_online_server.exe --trace --ticks=2000 --workers=2 --resources=resources/modules > ..\..\..\..\ci-xtrace\trace-windows.txt 2>&1"
          Pop-Location
          python .github/scripts/compare_traces.py ci-xtrace\trace-linux.txt ci-xtrace\trace-windows.txt $env:GITHUB_OUTPUT
          if ($LASTEXITCODE) {
            # Dump the world at the first divergent tick; the cross-platform job diffs it with Linux.
            $tick = (Select-String -Path $env:GITHUB_OUTPUT -Pattern '^tick=(\d+)' | Select-Object -Last 1).Matches[0].Groups[1].Value
            Push-Location build\subprojects\frontier_online\headless-package
            cmd /c "bin\frontier_online_server.exe --ticks=$tick --workers=2 --dump=..\..\..\..\ci-xtrace\world-windows.bin --resources=resources/modules > nul 2>&1"
            Pop-Location
            exit 1
          }

      - uses: actions/upload-artifact@v7
        # Bare conditions imply success(); the trace step has just failed on purpose.
        if: ${{ !cancelled() && steps.xtrace.outputs.diverged == 'true' }}
        with:
          name: frontier-divergence-windows
          path: ci-xtrace
          retention-days: 7

      - name: Test
        # A step over its own limit FAILS (the report runs); a job over its limit is cancelled.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 150
        run: |
          ctest --test-dir build -L devils_engine -E "$env:UNTRACKED_SCRIPT_TESTS" `
            --timeout $env:TEST_TIMEOUT --output-on-failure --parallel 2 2>&1 | Tee-Object -FilePath ci-logs\test.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Slowest tests
        if: always()
        run: python .github/scripts/slow_tests.py ci-logs\test.log

      - name: Probe hangs
        # Iteration 11: these playgrounds timed out even on --help. Stacks show where they wait.
        if: failure()
        run: |
          foreach ($name in @("GN02_planet_generator", "GN03_streaming_volume", "GN06_dungeon_layout")) {
            & .github/scripts/probe_hang.ps1 -Exe "build\subprojects\playgrounds\$name\bin\$name.exe" -Arguments "--help"
          }

      - name: Report errors
        if: failure() || cancelled()
        run: |
          $logs = @("ci-logs\configure.log", "ci-logs\build.log", "ci-logs\package.log", "ci-logs\test.log")
          # vcpkg writes the failing port's own logs under buildtrees; include them too.
          $logs += Get-ChildItem -Path "$env:VCPKG_ROOT\buildtrees" -Recurse -Filter "*-err.log" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          python .github/scripts/report_errors.py @logs

  cross-platform:
    # Runs only when the windows trace diverged: dumps the Linux world at the same tick and names
    # the component, entity and bytes that differ (the windows dump comes from its artifact).
    needs: windows
    if: ${{ !cancelled() && needs.windows.outputs.diverged == 'true' }}
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Install python
        run: apt-get update && apt-get install -y --no-install-recommends python3

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: frontier_online-linux-avx
          path: ci-xtrace

      - uses: actions/download-artifact@v8
        with:
          name: frontier-divergence-windows
          path: ci-xtrace

      - name: World diff
        run: |
          cd ci-xtrace
          tar -xzf frontier_online-linux-avx.tar.gz
          (cd headless-package && ./bin/frontier_online_server --ticks=${{ needs.windows.outputs.tick }} --workers=2 \
            --dump=../world-linux.bin --resources=resources/modules > /dev/null)
          python3 ../.github/scripts/world_diff.py world-linux.bin world-windows.bin
